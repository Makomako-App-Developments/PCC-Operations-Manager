kind = "mobile"
previewPath = "/field-ops/"
title = "GardenOps Field"
version = "1.0.0"
id = "artifacts/field-ops"
router = "path"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/field-ops/" ]
localPort = 21340

[services.development]
run = "pnpm --filter @workspace/field-ops run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/field-ops", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/field-ops", "run", "serve" ]

[services.env]
PORT = "21340"
BASE_PATH = "/field-ops/"
