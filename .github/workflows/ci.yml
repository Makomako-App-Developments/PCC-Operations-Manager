name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pcc
          POSTGRES_PASSWORD: pcc
          POSTGRES_DB: pcc_gardens
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://pcc:pcc@localhost:5432/pcc_gardens
      JWT_SECRET: ci-test-secret
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check generated API clients
        run: pnpm run check:api-contract

      - name: Push DB schema
        run: pnpm --filter @workspace/db run push

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests
        run: pnpm --filter @workspace/api-server run test

      - name: Build
        run: pnpm --filter @workspace/api-server run build && pnpm --filter @workspace/web-app run build

  photo-cleanup-postgres:
    name: Photo cleanup · PostgreSQL ${{ matrix.postgres-version }} concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: true
      matrix:
        postgres-version: ["16", "17"]

    services:
      postgres:
        image: postgres:${{ matrix.postgres-version }}-alpine
        env:
          POSTGRES_USER: pcc
          POSTGRES_PASSWORD: pcc
          POSTGRES_DB: pcc_photo_cleanup
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://pcc:pcc@localhost:5432/pcc_photo_cleanup
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Report PostgreSQL version
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c "SELECT version();"

      - name: Apply photo cleanup migrations
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f lib/db/drizzle/0018_photo_object_cleanup_queue.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 \
            -f lib/db/drizzle/0019_photo_object_cleanup_leases.sql

      - name: Check photo cleanup schema matches runtime
        run: pnpm --filter @workspace/db run check:photo-cleanup-schema

      - name: Run PostgreSQL photo cleanup integration test
        run: >-
          pnpm --filter @workspace/api-server exec vitest run
          src/__tests__/photo-cleanup-postgres.integration.test.ts
