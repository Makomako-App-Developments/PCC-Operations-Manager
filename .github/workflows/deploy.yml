name: Deploy to Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: []

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pcc
          POSTGRES_PASSWORD: pcc
          POSTGRES_DB: pcc_deploy_validation
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      REGISTRY: ${{ secrets.AZURE_REGISTRY }}
      API_IMAGE: pcc-gardens-api
      WEB_IMAGE: pcc-gardens-web

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check generated API clients
        run: pnpm run check:api-contract

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build API
        run: pnpm --filter @workspace/api-server run build

      - name: Build web app
        run: pnpm --filter @workspace/web-app run build
        env:
          VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN_FRONTEND }}

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.AZURE_REGISTRY }}
          username: ${{ secrets.AZURE_REGISTRY_USERNAME }}
          password: ${{ secrets.AZURE_REGISTRY_PASSWORD }}

      - name: Build, validate & push API image
        run: |
          docker build -f artifacts/api-server/Dockerfile -t $REGISTRY/$API_IMAGE:$GITHUB_SHA -t $REGISTRY/$API_IMAGE:latest .

          DATABASE_URL=postgresql://pcc:pcc@localhost:5432/pcc_deploy_validation \
            pnpm --filter @workspace/db run push

          container_name=api-deploy-validation
          cleanup() {
            docker logs "$container_name" > api-container-startup.log 2>&1 || true
            docker rm -f "$container_name" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach \
            --name "$container_name" \
            --add-host host.docker.internal:host-gateway \
            --publish 127.0.0.1:18080:8080 \
            --env DATABASE_URL=postgresql://pcc:pcc@host.docker.internal:5432/pcc_deploy_validation \
            --env JWT_SECRET=deploy-validation-only \
            "$REGISTRY/$API_IMAGE:$GITHUB_SHA"

          healthy=false
          for attempt in $(seq 1 30); do
            if ! docker inspect --format '{{.State.Running}}' "$container_name" | grep -qx true; then
              echo "API container exited before becoming healthy."
              exit 1
            fi

            if response=$(curl --fail --silent --show-error \
              http://127.0.0.1:18080/api/health/live); then
              if echo "$response" | grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"'; then
                healthy=true
                break
              fi
              echo "API liveness endpoint returned an unhealthy response: $response"
              exit 1
            fi
            sleep 1
          done

          if [ "$healthy" != true ]; then
            echo "Timed out waiting for the API liveness endpoint."
            exit 1
          fi

          docker push $REGISTRY/$API_IMAGE:$GITHUB_SHA
          docker push $REGISTRY/$API_IMAGE:latest

      - name: Upload API startup logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: api-container-startup-${{ github.sha }}
          path: api-container-startup.log
          if-no-files-found: warn

      - name: Build & push web image
        run: |
          docker build -f artifacts/web-app/Dockerfile -t $REGISTRY/$WEB_IMAGE:$GITHUB_SHA -t $REGISTRY/$WEB_IMAGE:latest .
          docker push $REGISTRY/$WEB_IMAGE:$GITHUB_SHA
          docker push $REGISTRY/$WEB_IMAGE:latest

      - name: Deploy API to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_API_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_API_PUBLISH_PROFILE }}
          images: ${{ secrets.AZURE_REGISTRY }}/${{ env.API_IMAGE }}:${{ github.sha }}

      - name: Wait for deployed API readiness
        env:
          API_APP_NAME: ${{ secrets.AZURE_API_APP_NAME }}
        run: |
          endpoint="https://${API_APP_NAME}.azurewebsites.net/api/health/ready"
          response_file=$(mktemp)
          trap 'rm -f "$response_file"' EXIT

          ready=false
          for attempt in $(seq 1 30); do
            : > "$response_file"
            http_status=$(curl --silent --show-error \
              --connect-timeout 10 \
              --max-time 15 \
              --output "$response_file" \
              --write-out '%{http_code}' \
              "$endpoint") || http_status="request_failed"

            response_status=$(jq -r 'if type == "object" then (.status // "missing") else "invalid" end' \
              "$response_file" 2>/dev/null || echo "invalid")
            cb_state=$(jq -r 'if type == "object" then (.cbState // "missing") else "invalid" end' \
              "$response_file" 2>/dev/null || echo "invalid")

            if [ "$http_status" = "200" ] && [ "$response_status" = "ready" ]; then
              echo "Deployed API is ready (HTTP $http_status, status=$response_status, cbState=$cb_state)."
              ready=true
              break
            fi

            echo "Readiness attempt $attempt/30 was not ready (HTTP $http_status, status=$response_status, cbState=$cb_state)."
            if [ "$attempt" -lt 30 ]; then
              sleep 10
            fi
          done

          if [ "$ready" != true ]; then
            echo "Timed out waiting for deployed API readiness (HTTP $http_status, status=$response_status, cbState=$cb_state)."
            exit 1
          fi

      - name: Deploy web to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEB_APP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEB_PUBLISH_PROFILE }}
          images: ${{ secrets.AZURE_REGISTRY }}/${{ env.WEB_IMAGE }}:${{ github.sha }}

      - name: Run DB migrations on production
        run: |
          az webapp ssh --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name ${{ secrets.AZURE_API_APP_NAME }} \
            --command "node -e \"require('./dist/migrate').runMigrations()\""
        env:
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
