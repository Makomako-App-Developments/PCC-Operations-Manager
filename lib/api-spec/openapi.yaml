            schema: { $ref: "#/components/schemas/StormJobPhotoUpload" }
      responses:
        "201":
          description: Storm Patrol job photo uploaded
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /storm-patrol/jobs/{id}/photos/{photoId}:
