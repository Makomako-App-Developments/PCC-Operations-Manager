  /storm-patrol/events/{id}/report:
    get:
      operationId: getStormPatrolReport
      tags: [storm-patrol]
      parameters:
        [
          {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          },
        ]
      responses:
        {
          "200":
            {
              description: JSON report or CSV when format=csv,
              content:
                {
                  application/json:
                    { schema: { $ref: "#/components/schemas/StormReport" } },
                  text/csv: { schema: { type: string } },
                  application/pdf: { schema: { type: string, format: binary } },
                },
            },
        }

# ─── Shared responses ──────────────────────────────────────────────────────────
components:
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorised:
      description: Unauthorised
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    StormwaterAssetImportPreview:
      type: object
      required: [batchKey, valid, summary, errors, warnings]
      properties:
        batchKey: { type: string }
        valid: { type: boolean }
        summary:
          type: object
          required: [totalRows, validRows, invalidRows, warnings, alreadyImported]
          properties:
            totalRows: { type: integer }
            validRows: { type: integer }
            invalidRows: { type: integer }
            warnings: { type: integer }
            alreadyImported: { type: boolean }
        errors: { type: array, items: { type: string } }
        warnings: { type: array, items: { type: string } }
    StormwaterAssetImportCommit:
      type: object
      required: [batchKey, created, updated, alreadyImported]
      properties:
        batchKey: { type: string }
        created: { type: integer }
        updated: { type: integer }
        alreadyImported: { type: boolean }
    StormEvent:
      type: object
      required: [id, name, status, hourlyRateCents]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        status: { type: string, enum: [draft, active, closed] }
        hourlyRateCents: { type: integer }
        activatedAt: { type: string, format: date-time, nullable: true }
        closedAt: { type: string, format: date-time, nullable: true }
    StormJob:
      type: object
      required: [id, eventId, workPackageId, phase, assetId, teamId, status, workTypes, photos]
      properties:
        id: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        workPackageId: { type: string, format: uuid }
        phase: { type: string, enum: [pre, mid, post] }
        assetId: { type: string, format: uuid }
        teamId: { type: string, format: uuid }
        assignedUserId: { type: string, format: uuid, nullable: true }
        routeOrder: { type: integer, nullable: true }
        status:
          {
            type: string,
            enum: [pending, in_progress, completed, too_dangerous],
          }
        actualTimeMins: { type: integer, nullable: true }
        comments: { type: string, nullable: true }
        assetName: { type: string }
        assetDescription: { type: string, nullable: true }
        streetAddress: { type: string, nullable: true }
        suburb: { type: string, nullable: true }
        lat: { type: number, nullable: true }
        lng: { type: number, nullable: true }
        departmentDetails: { nullable: true }
        teamName: { type: string, nullable: true }
        workerName: { type: string, nullable: true }
        workTypes: { type: array, items: { type: string } }
        photos:
          type: array
          items: { $ref: "#/components/schemas/StormObservationPhoto" }
    StormObservationPhoto:
      type: object
      required: [id, purpose, blobUrl, createdAt]
      properties:
        id: { type: string, format: uuid }
        purpose: { type: string, enum: [before, after, urgent_issue, new_flooding, new_slip, observation] }
        blobUrl: { type: string }
        caption: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    StormObservation:
      type: object
      required: [id, eventId, description, locationLat, locationLng, createdAt, photos]
      properties:
        id: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        sourceJobId: { type: string, format: uuid, nullable: true }
        assetId: { type: string, format: uuid, nullable: true }
        description: { type: string }
        notes: { type: string, nullable: true }
        locationLat: { type: number }
        locationLng: { type: number }
        reactiveJobId: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
        photos:
          type: array
          items: { $ref: "#/components/schemas/StormObservationPhoto" }
    StormEventListResponse:
      type: object
      required: [data]
      properties:
        {
          data:
            { type: array, items: { $ref: "#/components/schemas/StormEvent" } },
        }
    StormJobListResponse:
      type: object
      required: [data]
      properties:
        {
          data:
            { type: array, items: { $ref: "#/components/schemas/StormJob" } },
        }
    StormCurrentResponse:
      type: object
      required: [data]
      properties:
        data:
          nullable: true
          type: object
          required: [event, jobs, summary]
          properties:
            event: { $ref: "#/components/schemas/StormEvent" }
            jobs:
              { type: array, items: { $ref: "#/components/schemas/StormJob" } }
            observations:
              {
                type: array,
                items: { $ref: "#/components/schemas/StormObservation" },
              }
            followUps:
              {
                type: array,
                items: { type: object, additionalProperties: true },
              }
            alerts:
              {
                type: array,
                items: { $ref: "#/components/schemas/StormAlert" },
              }
            summary: { type: object, additionalProperties: { type: integer } }
    StormPackagePublishResponse:
      type: object
      required: [package, jobs]
      properties:
        package: { type: object, additionalProperties: true }
        jobs: { type: array, items: { $ref: "#/components/schemas/StormJob" } }
    StormCompletionResponse:
      type: object
      required: [job, replayed]
      properties:
        job: { $ref: "#/components/schemas/StormJob" }
        followUp: { type: object, nullable: true, additionalProperties: true }
        replayed: { type: boolean }
    StormObservationResponse:
      type: object
      required: [observation, replayed]
      properties:
        observation: { type: object, additionalProperties: true }
        reactiveJob: { type: object, additionalProperties: true }
        replayed: { type: boolean }
    StormAlert:
      type: object
      required: [id, eventId, message, emailStatus, emailAttempts]
      properties:
        id: { type: string, format: uuid }
        eventId: { type: string, format: uuid }
        message: { type: string }
        acknowledgedAt: { type: string, format: date-time, nullable: true }
        emailStatus: { type: string, enum: [pending, sent, failed] }
        emailAttempts: { type: integer }
        emailLastError: { type: string, nullable: true }
        emailLastAttemptAt: { type: string, format: date-time, nullable: true }
        emailSentAt: { type: string, format: date-time, nullable: true }
    StormAlertCreate:
      type: object
      required: [eventId, message, idempotencyKey]
      properties:
        eventId: { type: string, format: uuid }
        stormJobId: { type: string, format: uuid }
        message: { type: string, minLength: 1 }
        photoUrl: { type: string }
        idempotencyKey: { type: string, minLength: 1, maxLength: 200 }
    StormAlertListResponse:
      type: object
      required: [data]
      properties:
        {
          data:
            { type: array, items: { $ref: "#/components/schemas/StormAlert" } },
        }
    StormReport:
      type: object
      required:
        [
          event,
          selectedCount,
          checkedCount,
          totalMinutes,
          totalHours,
          labourChargeCents,
          jobs,
        ]
      properties:
        event: { $ref: "#/components/schemas/StormEvent" }
        selectedCount: { type: integer }
        checkedCount: { type: integer }
        totalMinutes: { type: integer }
        totalHours: { type: number }
        labourChargeCents: { type: integer }
        jobs: { type: array, items: { $ref: "#/components/schemas/StormJob" } }
    StormEventCreate:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        activate: { type: boolean, default: true }
        hourlyRateCents: { type: integer, minimum: 0 }
    StormPackagePublish:
      type: object
      required: [phase, teamId, assetIds]
      properties:
        phase: { type: string, enum: [pre, mid, post] }
        teamId: { type: string, format: uuid }
        assetIds:
          { type: array, minItems: 1, items: { type: string, format: uuid } }
        idempotencyKey: { type: string }
    StormCompletion:
      type: object
      required: [outcome, actualTimeMins, idempotencyKey]
      properties:
        outcome: { type: string, enum: [completed, too_dangerous] }
        actualTimeMins: { type: integer, minimum: 0 }
        comments:
          {
            type: string,
            maxLength: 10000,
            description: Required and non-blank when workTypes contains visual_check_only.,
          }
        workTypes:
          {
            type: array,
            description: Selecting visual_check_only requires comments describing the observation.,
            items:
              {
                type: string,
                enum:
                  [
                    silt_clearance,
                    litter_clearance,
                    debris_clearance,
                    visual_check_only,
                    litter_debris_removed_from_site,
                    site_too_dangerous,
                    site_made_safe,
                  ],
              },
          }
        dangerousReason: { type: string }
        locationLat: { type: number }
        locationLng: { type: number }
        idempotencyKey: { type: string, minLength: 1 }
    StormObservationCreate:
      type: object
      required: [eventId, description, locationLat, locationLng, idempotencyKey]
      properties:
        eventId: { type: string, format: uuid }
        assetId: { type: string, format: uuid }
        sourceJobId: { type: string, format: uuid }
        description: { type: string }
        notes: { type: string }
        locationLat: { type: number }
        locationLng: { type: number }
        idempotencyKey: { type: string }
    StormObservationPhotoUpload:
      type: object
      required: [photo, observationIdempotencyKey, idempotencyKey]
      properties:
        photo: { type: string, format: binary }
        observationIdempotencyKey: { type: string }
        idempotencyKey: { type: string }
    StormJobPhotoUpload:
      type: object
      required: [photo, purpose, idempotencyKey]
      properties:
        photo: { type: string, format: binary }
        purpose:
          type: string
          enum: [before, after, urgent_issue, new_flooding, new_slip, observation]
        caption: { type: string }
        idempotencyKey: { type: string }

    # ─── Primitives / enums ─────────────────────────────────────────────────
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    OkResponse:
      type: object
      properties:
        ok:
          type: boolean
      required: [ok]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    Role:
      type: string
      enum: [administrator, manager, supervisor, team_leader, field_worker]

    GardenType:
      type: string
      enum:
        - annuals
        - roses_perennials
        - ornamental
        - amenity
        - rain_garden
        - reveg
        - bush
        - tree_planter_pits
        - hedge

    Department:
      type: string
      enum: [horticulture, mowing, litter, sportsfields, cemetery, city_services_maintenance, tracks_coastal_rangers, biosecurity_rangers, stormwater]

    Standard:
      type: string
      enum: [high, medium, low]

    Ward:
      type: string
      enum: [eastern, northern, western]

    Frequency:
      type: string
      enum: [weekly, fortnightly, monthly, bimonthly, quarterly]

    JobType:
      type: string
      enum: [scheduled, reactive, mulching, infill_planting]

    JobStatus:
      type: string
      enum: [draft, pending, in_progress, paused, completed, skipped, overdue]

    AuditStatus:
      type: string
      enum: [pending, passed, failed, overdue]

    AuditResult:
      type: string
      enum: [pass, fail, na]

    ReactiveJobStatus:
      type: string
      enum: [raised, assigned, in_progress, completed, cancelled]

    ReactivePriority:
      type: string
      enum: [low, medium, high, urgent]

    # ─── Auth ───────────────────────────────────────────────────────────────
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
      required: [email, password]

    LoginResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/UserSummary"
        accessToken:
          type: string
      required: [user, accessToken]

    # ─── Users ──────────────────────────────────────────────────────────────
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        initials: { type: string }
        role:
          $ref: "#/components/schemas/Role"
        teamId: { type: string, format: uuid, nullable: true }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required:
        [id, email, name, initials, role, isActive, createdAt, updatedAt]

    UserSummary:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        initials: { type: string }
        role:
          $ref: "#/components/schemas/Role"
        teamId: { type: string, format: uuid, nullable: true }
      required: [id, name, initials, role]

    # ─── Teams ──────────────────────────────────────────────────────────────
    Team:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        department:
          $ref: "#/components/schemas/Department"
        createdAt: { type: string, format: date-time }
      required: [id, name, department, createdAt]

    TeamCreate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        department:
          $ref: "#/components/schemas/Department"
      required: [name, department]

    # ─── Assets ─────────────────────────────────────────────────────────────
    HorticultureAssetDetails:
      type: object
      description: Horticulture-only fields. Required when department is horticulture; legacy assets use these top-level fields.
      properties:
        gardenType:
          $ref: "#/components/schemas/GardenType"
        standard:
          $ref: "#/components/schemas/Standard"
      required: [gardenType, standard]

    MowingAssetDetails:
      type: object
      description: Required specification for mowing assets.
      properties:
        mowingType:
          type: string
          enum: [amenity_turf, sports_turf, roadside_verge, rough_grass]
      required: [mowingType]

    SportsfieldsAssetDetails:
      type: object
      description: Required specification for sportsfield assets.
      properties:
        surfaceType:
          type: string
          enum: [natural_turf, artificial_turf, hard_court]
      required: [surfaceType]

    LitterAssetDetails:
      type: object
      description: Required specification for Litter assets.
      properties:
        cleaningType:
          type: string
          enum: [litter_bin, street_sweeping, graffiti, pressure_washing]
      required: [cleaningType]

    StormwaterAssetDetails:
      type: object
      properties:
        placemarkId: { type: string }
        contractor:
          {
            type: string,
            enum: [Parks, Transport, WGTN Regional, Taiki Wai, Other],
          }
        assetType: { type: string, enum: [inlet, outlet, culvert, other] }
        priority: { type: string, enum: [High, Medium, Low] }
        hotspot: { type: string, enum: [Yes, No] }
      required: [contractor, assetType, priority, hotspot]

    GenericDepartmentAssetDetails:
      type: object
      description: Optional future department-specific details where PCC has not yet defined a controlled subtype taxonomy.
      maxProperties: 0
      additionalProperties: false

    DepartmentDetails:
      description: Use the details schema matching department. Horticulture assets use gardenType and standard for backwards compatibility.
      oneOf:
        - $ref: "#/components/schemas/MowingAssetDetails"
        - $ref: "#/components/schemas/SportsfieldsAssetDetails"
        - $ref: "#/components/schemas/LitterAssetDetails"
        - $ref: "#/components/schemas/StormwaterAssetDetails"
        - $ref: "#/components/schemas/GenericDepartmentAssetDetails"

    Asset:
      type: object
      properties:
        id: { type: string, format: uuid }
        globalId: { type: ["string", "null"] }
        name: { type: string }
        department:
          $ref: "#/components/schemas/Department"
        gardenType:
          nullable: true
          $ref: "#/components/schemas/GardenType"
        standard:
          nullable: true
          $ref: "#/components/schemas/Standard"
        areaM2: { type: number, nullable: true }
        serviceTimeMins: { type: ["integer", "null"] }
        frequency:
          oneOf:
            - $ref: "#/components/schemas/Frequency"
            - type: "null"
        isSchedulable: { type: boolean }
        departmentDetails:
          oneOf:
            - $ref: "#/components/schemas/DepartmentDetails"
            - type: "null"
        siteType: { type: string, enum: [park, street], nullable: true }
        teamId: { type: string, format: uuid, nullable: true }
        ward:
          allOf:
            - $ref: "#/components/schemas/Ward"
          nullable: true
        suburb: { type: string, nullable: true }
        streetAddress: { type: string, nullable: true }
        lat: { type: number, nullable: true }
        lng: { type: number, nullable: true }
        routeOrder: { type: integer, nullable: true }
        description: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required:
        - id
        - name
        - department
        - isSchedulable
        - isActive
        - createdAt
        - updatedAt

    AssetCreate:
      type: object
      description: Common fields are required for every asset. Horticulture requires gardenType and standard; Mowing and Sportsfields require areaM2; Mowing, Litter, and Sportsfields require their matching DepartmentDetails specification.
      properties:
        globalId: { type: ["string", "null"] }
        name: { type: string }
        department:
          $ref: "#/components/schemas/Department"
        gardenType:
          nullable: true
          $ref: "#/components/schemas/GardenType"
        standard:
          nullable: true
          $ref: "#/components/schemas/Standard"
        areaM2: { type: number, nullable: true }
        serviceTimeMins: { type: ["integer", "null"] }
        frequency:
          oneOf:
            - $ref: "#/components/schemas/Frequency"
            - type: "null"
        isSchedulable: { type: boolean }
        departmentDetails:
          $ref: "#/components/schemas/DepartmentDetails"
        siteType: { type: string, enum: [park, street] }
        teamId: { type: string, format: uuid }
        ward:
          $ref: "#/components/schemas/Ward"
        suburb: { type: string }
        streetAddress: { type: string }
        lat: { type: number }
        lng: { type: number }
        routeOrder: { type: integer }
        description: { type: string }
        notes: { type: string }
      required:
        - name
        - department

    AssetUpdate:
      type: object
      properties:
        name: { type: string }
        department:
          $ref: "#/components/schemas/Department"
        gardenType:
          nullable: true
          $ref: "#/components/schemas/GardenType"
        standard:
          nullable: true
          $ref: "#/components/schemas/Standard"
        areaM2: { type: number, nullable: true }
        serviceTimeMins: { type: ["integer", "null"] }
        frequency:
          oneOf:
            - $ref: "#/components/schemas/Frequency"
            - type: "null"
        isSchedulable: { type: boolean }
        departmentDetails:
          $ref: "#/components/schemas/DepartmentDetails"
        teamId: { type: string, format: uuid }
        ward:
          $ref: "#/components/schemas/Ward"
        suburb: { type: string }
        streetAddress: { type: string }
        lat: { type: number }
        lng: { type: number }
        notes: { type: string }
        isActive: { type: boolean }

    AssetListResponse:
      type: object
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Asset" } }
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }
      required: [data, total, page, limit]

    # ─── Jobs ───────────────────────────────────────────────────────────────
    Job:
      type: object
      properties:
        id: { type: string, format: uuid }
        assetId: { type: string, format: uuid }
        jobType:
          $ref: "#/components/schemas/JobType"
        status:
          $ref: "#/components/schemas/JobStatus"
        teamId: { type: string, format: uuid, nullable: true }
        assignedUserId: { type: string, format: uuid, nullable: true }
        assignedUserName:
          {
            type: string,
            nullable: true,
            description: "Name of the worker who claimed this job.",
          }
        scheduledDate: { type: string, format: date }
        originalScheduledDate: { type: string, format: date, nullable: true }
        startedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        actualTimeMins: { type: integer, nullable: true }
        notes: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required:
        - id
        - assetId
        - jobType
        - status
        - scheduledDate
        - createdAt
        - updatedAt

    JobCreate:
      type: object
      properties:
        assetId: { type: string, format: uuid }
        jobType:
          $ref: "#/components/schemas/JobType"
        teamId: { type: string, format: uuid }
        assignedUserId: { type: string, format: uuid }
        scheduledDate: { type: string, format: date }
        notes: { type: string }
      required: [assetId, jobType, scheduledDate]

    JobUpdate:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/JobStatus"
        assignedUserId: { type: string, format: uuid }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        actualTimeMins: { type: integer }
        notes: { type: string }

    SkipReviewOutcome:
      type: string
      enum: [accepted, rejected]

    SkipReviewRequest:
      type: object
      properties:
        outcome:
          $ref: "#/components/schemas/SkipReviewOutcome"
        notes: { type: string }
      required: [outcome]

    TaskSkipReason:
      type: object
      properties:
        id: { type: string, format: uuid }
        jobId: { type: string, format: uuid }
        taskIndex: { type: integer }
        taskLabel: { type: string }
        reason: { type: string }
        createdById: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
      required: [id, jobId, taskIndex, taskLabel, reason, createdAt]

    SkippedJob:
      type: object
      properties:
        id: { type: string, format: uuid }
        assetId: { type: string, format: uuid }
        jobType:
          $ref: "#/components/schemas/JobType"
        status:
          $ref: "#/components/schemas/JobStatus"
        teamId: { type: string, format: uuid, nullable: true }
        scheduledDate: { type: string, format: date }
        skipReason: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        skipReviewedAt: { type: string, format: date-time, nullable: true }
        skipReviewedById: { type: string, format: uuid, nullable: true }
        skipReviewOutcome:
          allOf:
            - $ref: "#/components/schemas/SkipReviewOutcome"
          nullable: true
        skipReviewNotes: { type: string, nullable: true }
        reviewerName: { type: string, nullable: true }
        reviewerInitials: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        taskSkipReasons:
          {
            type: array,
            items: { $ref: "#/components/schemas/TaskSkipReason" },
          }
      required:
        [
          id,
          assetId,
          jobType,
          status,
          scheduledDate,
          createdAt,
          updatedAt,
          taskSkipReasons,
        ]

    SkippedJobListResponse:
      type: object
      properties:
        data:
          { type: array, items: { $ref: "#/components/schemas/SkippedJob" } }
        page: { type: integer }
        limit: { type: integer }
      required: [data, page, limit]

    JobListResponse:
      type: object
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Job" } }
        page: { type: integer }
        limit: { type: integer }
      required: [data, page, limit]

    ReactiveJob:
      type: object
      properties:
        id: { type: string, format: uuid }
        assetId: { type: string, format: uuid, nullable: true }
        raisedById: { type: string, format: uuid }
        assignedTeamId: { type: string, format: uuid, nullable: true }
        assignedUserId: { type: string, format: uuid, nullable: true }
        assignedUserName:
          {
            type: string,
            nullable: true,
            description: "Name of the worker who claimed this job.",
          }
        issueType: { type: string }
        description: { type: string }
        location: { type: string, nullable: true }
        locationLat: { type: number, nullable: true }
        locationLng: { type: number, nullable: true }
        scheduledDate: { type: string, format: date, nullable: true }
        estimatedTimeMins: { type: integer, nullable: true }
        status:
          $ref: "#/components/schemas/ReactiveJobStatus"
        priority:
          $ref: "#/components/schemas/ReactivePriority"
        schedulingPolicy:
          type: string
          enum: [unscheduled_first, scheduled_first]
          nullable: true
        raisedAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time, nullable: true }
        completedAt: { type: string, format: date-time, nullable: true }
        actualTimeMins: { type: integer, nullable: true }
        notes: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required:
        - id
        - raisedById
        - issueType
        - description
        - status
        - priority
        - raisedAt
        - createdAt
        - updatedAt

    ReactiveJobCreate:
      type: object
      properties:
        assetId: { type: string, format: uuid }
        issueType: { type: string }
        description: { type: string }
        priority:
          $ref: "#/components/schemas/ReactivePriority"
        assignedTeamId: { type: string, format: uuid }
        scheduledDate: { type: string, format: date }
        estimatedTimeMins: { type: integer }
        schedulingPolicy:
          type: string
          enum: [unscheduled_first, scheduled_first]
      required: [assetId, issueType, description]

    ReactiveJobUpdate:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/ReactiveJobStatus"
        priority:
          $ref: "#/components/schemas/ReactivePriority"
        assignedTeamId: { type: string, format: uuid }
        assignedUserId: { type: string, format: uuid }
        scheduledDate: { type: string, format: date, nullable: true }
        estimatedTimeMins: { type: integer, nullable: true }
        schedulingPolicy:
          type: string
          enum: [unscheduled_first, scheduled_first]
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        actualTimeMins: { type: integer }
        notes: { type: string }

    ReactiveJobListResponse:
      type: object
      properties:
        data:
          { type: array, items: { $ref: "#/components/schemas/ReactiveJob" } }
      required: [data]

    # ─── Audits ─────────────────────────────────────────────────────────────
    Audit:
      type: object
      properties:
        id: { type: string, format: uuid }
        assetId: { type: string, format: uuid }
        auditorId: { type: string, format: uuid }
        teamId: { type: string, format: uuid, nullable: true }
        scheduledDate: { type: string, format: date, nullable: true }
        conductedAt: { type: string, format: date-time }
        completedDate: { type: string, format: date, nullable: true }
        overallScore: { type: number, minimum: 0, maximum: 100, nullable: true }
        status:
          $ref: "#/components/schemas/AuditStatus"
        notes: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required:
        - id
        - assetId
        - auditorId
        - conductedAt
        - status
        - createdAt
        - updatedAt

    AuditCreate:
      type: object
      properties:
        assetId: { type: string, format: uuid }
        teamId: { type: string, format: uuid }
        conductedAt: { type: string, format: date-time }
        notes: { type: string }
      required: [assetId]

    AuditUpdate:
      type: object
      properties:
        teamId: { type: string, format: uuid }
        conductedAt: { type: string, format: date-time }
        completedDate: { type: string, format: date }
        overallScore: { type: number, minimum: 0, maximum: 100 }
        status:
          $ref: "#/components/schemas/AuditStatus"
        notes: { type: string }

    AuditItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        auditId: { type: string, format: uuid }
        criterion: { type: string }
        result:
          $ref: "#/components/schemas/AuditResult"
        notes: { type: string, nullable: true }
        failLat: { type: number, nullable: true }
        failLng: { type: number, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        photos:
          type: array
          items:
            $ref: "#/components/schemas/AuditPhoto"
      required: [id, auditId, criterion, result, createdAt, updatedAt]

    AuditItemResponse:
      type: object
      properties:
        criterion: { type: string }
        result:
          $ref: "#/components/schemas/AuditResult"
        notes: { type: string }
        failLat: { type: number }
        failLng: { type: number }
      required: [criterion, result]

    AuditResponsesBulk:
      type: object
      properties:
        responses:
          type: array
          items:
            $ref: "#/components/schemas/AuditItemResponse"
      required: [responses]

    AuditPhoto:
      type: object
      properties:
        id: { type: string, format: uuid }
        auditItemId: { type: string, format: uuid }
        uploadedBy: { type: string, format: uuid }
        blobUrl: { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, auditItemId, uploadedBy, blobUrl, createdAt]

    AuditDetail:
      allOf:
        - $ref: "#/components/schemas/Audit"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/AuditItem"
          required: [items]

    AuditListResponse:
      type: object
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Audit" } }
      required: [data]

    # ─── Dashboard ──────────────────────────────────────────────────────────
    AssetTypeCount:
      type: object
      properties:
        gardenType: { type: string }
        count: { type: integer }
      required: [gardenType, count]

    TeamJobCount:
      type: object
      properties:
        teamId: { type: string, format: uuid }
        teamName: { type: string }
        jobCount: { type: integer }
        completedCount: { type: integer }
      required: [teamId, teamName, jobCount, completedCount]

    DashboardSummary:
      type: object
      properties:
        totalAssets: { type: integer }
        activeAssets: { type: integer }
        jobsThisWeek: { type: integer }
        completedThisWeek: { type: integer }
        overdueJobs: { type: integer }
        openReactiveJobs: { type: integer }
        assetsByType:
          type: array
          items: { $ref: "#/components/schemas/AssetTypeCount" }
        teamSummary:
          type: array
          items: { $ref: "#/components/schemas/TeamJobCount" }
      required:
        - totalAssets
        - activeAssets
        - jobsThisWeek
        - completedThisWeek
        - overdueJobs
        - openReactiveJobs
        - assetsByType
        - teamSummary

    # ─── Schedule ────────────────────────────────────────────────────────────
    ScheduleGenerateBody:
      type: object
      properties:
        fromDate: { type: string, format: date }
        toDate: { type: string, format: date }
        teamId: { type: string, format: uuid }
      required: [fromDate, toDate]

    ScheduleGenerateResult:
      type: object
      properties:
        jobsCreated: { type: integer }
        fromDate: { type: string, format: date }
        toDate: { type: string, format: date }
      required: [jobsCreated, fromDate, toDate]

    JobWithAsset:
      allOf:
        - $ref: "#/components/schemas/Job"
        - type: object
          properties:
            assetName: { type: string }
            assetRef: { type: string }
            gardenType: { type: string }
            suburb: { type: string, nullable: true }
            serviceTimeMins: { type: integer }
            priority:
              $ref: "#/components/schemas/ReactivePriority"
          required: [assetName, assetRef, gardenType, serviceTimeMins]

    ScheduleWeekDay:
      type: object
      properties:
        date: { type: string, format: date }
        jobs:
          type: array
          items: { $ref: "#/components/schemas/JobWithAsset" }
      required: [date, jobs]

    ScheduleWeekResponse:
      type: object
      properties:
        weekStart: { type: string, format: date }
        weekEnd: { type: string, format: date }
        days:
          type: array
          items: { $ref: "#/components/schemas/ScheduleWeekDay" }
        totalJobs: { type: integer }
        completedJobs: { type: integer }
      required: [weekStart, weekEnd, days, totalJobs, completedJobs]

    OverdueScheduleJobsResponse:
      type: object
      properties:
        jobs:
          type: array
          items: { $ref: "#/components/schemas/JobWithAsset" }
        total: { type: integer }
        totalEstimatedMins: { type: integer }
        oldestScheduledDate: { type: string, format: date, nullable: true }
      required: [jobs, total, totalEstimatedMins, oldestScheduledDate]

    ResolveOverdueJobsInput:
      type: object
      properties:
        jobIds:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: string, format: uuid }
        action:
          type: string
          enum: [keep, move, reassign, complete, skip]
        reason: { type: string, minLength: 1, maxLength: 1000 }
        destinationDate: { type: string, format: date }
        destinationTeamId: { type: string, format: uuid }
        forceCapacity: { type: boolean, default: false }
      required: [jobIds, action, reason]

    ResolveOverdueJobResult:
      type: object
      properties:
        jobId: { type: string, format: uuid }
        success: { type: boolean }
        message: { type: string }
        scheduledDate: { type: string, format: date, nullable: true }
        teamId: { type: string, format: uuid, nullable: true }
      required: [jobId, success, message]

    ResolveOverdueJobsResponse:
      type: object
      properties:
        succeeded: { type: integer }
        failed: { type: integer }
        results:
          type: array
          items: { $ref: "#/components/schemas/ResolveOverdueJobResult" }
      required: [succeeded, failed, results]

    # ─── Programmes ──────────────────────────────────────────────────────────
    InfillStatus:
      type: string
      enum: [draft, ordered, delivered, planted]

    MulchingStatus:
      type: string
      enum: [due, scheduled, completed, not_required]

    InfillOrder:
      type: object
      properties:
        id: { type: string, format: uuid }
        assetId: { type: string, format: uuid }
        assetName: { type: string, nullable: true }
        assetRef: { type: string, nullable: true }
        speciesName: { type: string }
        speciesCategory: { type: string }
        quantity: { type: integer }
        status:
          $ref: "#/components/schemas/InfillStatus"
        orderedById: { type: string, format: uuid, nullable: true }
        orderDate: { type: string, format: date, nullable: true }
        deliveryDate: { type: string, format: date, nullable: true }
        plantedDate: { type: string, format: date, nullable: true }
        supplierRef: { type: string, nullable: true }
        unitCostNzd: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required:
        [
          id,
          assetId,
          speciesName,
          speciesCategory,
          quantity,
          status,
          createdAt,
          updatedAt,
        ]

    InfillOrderCreate:
      type: object
      properties:
        assetId: { type: string, format: uuid }
        speciesName: { type: string }
        speciesCategory: { type: string }
        quantity: { type: integer }
        status:
          $ref: "#/components/schemas/InfillStatus"
        orderDate: { type: string, format: date }
        deliveryDate: { type: string, format: date }
        plantedDate: { type: string, format: date }
        supplierRef: { type: string }
        unitCostNzd: { type: string }
        notes: { type: string }
      required: [assetId, speciesName, speciesCategory, quantity]

    InfillOrderUpdate:
      type: object
      properties:
        speciesName: { type: string }
        speciesCategory: { type: string }
        quantity: { type: integer }
        status:
          $ref: "#/components/schemas/InfillStatus"
        orderDate: { type: string, format: date }
        deliveryDate: { type: string, format: date }
        plantedDate: { type: string, format: date }
        supplierRef: { type: string }
        unitCostNzd: { type: string }
        notes: { type: string }

    InfillOrderListResponse:
      type: object
      properties:
        data:
          { type: array, items: { $ref: "#/components/schemas/InfillOrder" } }
        total: { type: integer }
      required: [data, total]

    MulchingRecord:
      type: object
      properties:
        id: { type: string, format: uuid }
        assetId: { type: string, format: uuid }
        assetName: { type: string, nullable: true }
        assetRef: { type: string, nullable: true }
        scheduledDate: { type: string, format: date, nullable: true }
        completedDate: { type: string, format: date, nullable: true }
        volumeM3: { type: string, nullable: true }
        status:
          $ref: "#/components/schemas/MulchingStatus"
        mulchType: { type: string, nullable: true }
        contractor: { type: string, nullable: true }
        costNzd: { type: string, nullable: true }
        notes: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, assetId, status, createdAt, updatedAt]

    MulchingRecordCreate:
      type: object
      properties:
        assetId: { type: string, format: uuid }
        scheduledDate: { type: string, format: date }
        completedDate: { type: string, format: date }
        volumeM3: { type: string }
        status:
          $ref: "#/components/schemas/MulchingStatus"
        mulchType: { type: string }
        contractor: { type: string }
        costNzd: { type: string }
        notes: { type: string }
      required: [assetId]

    MulchingRecordUpdate:
      type: object
      properties:
        scheduledDate: { type: string, format: date }
        completedDate: { type: string, format: date }
        volumeM3: { type: string }
        status:
          $ref: "#/components/schemas/MulchingStatus"
        mulchType: { type: string }
        contractor: { type: string }
        costNzd: { type: string }
        notes: { type: string }

    MulchingRecordListResponse:
      type: object
      properties:
        data:
          {
            type: array,
            items: { $ref: "#/components/schemas/MulchingRecord" },
          }
        total: { type: integer }
      required: [data, total]

    MulchDepthImportRow:
      type: object
      properties:
        rowNumber: { type: integer }
        globalId: { type: string }
        siteName: { type: string }
        recordedAt: { type: string, format: date }
        depthMm: { type: integer }
        warning: { type: string, nullable: true }
        error: { type: string, nullable: true }
      required: [rowNumber, globalId, siteName, recordedAt, depthMm]

    MulchDepthImportPreview:
      type: object
      properties:
        batchKey: { type: string }
        valid: { type: boolean }
        summary:
          type: object
          properties:
            totalRows: { type: integer }
            validRows: { type: integer }
            invalidRows: { type: integer }
            warnings: { type: integer }
            alreadyImported: { type: boolean }
          required:
            [totalRows, validRows, invalidRows, warnings, alreadyImported]
        rows:
          type: array
          items: { $ref: "#/components/schemas/MulchDepthImportRow" }
        errors: { type: array, items: { type: string } }
        warnings: { type: array, items: { type: string } }
      required: [batchKey, valid, summary, rows, errors, warnings]

    MulchDepthImportCommit:
      type: object
      properties:
        batchKey: { type: string }
        createdReadings: { type: integer }
        createdDrafts: { type: integer }
        updatedDrafts: { type: integer }
        alreadyImported: { type: boolean }
        message: { type: string }
      required:
        [
          batchKey,
          createdReadings,
          createdDrafts,
          updatedDrafts,
          alreadyImported,
          message,
        ]

    # ─── Health (extended) ─────────────────────────────────────────────────────
    ReadinessResponse:
      type: object
      properties:
        status: { type: string }
        dbLatencyMs: { type: number }
        cbState: { type: string, enum: [CLOSED, OPEN, HALF_OPEN] }
      required: [status, dbLatencyMs, cbState]

    ReadinessErrorResponse:
      type: object
      properties:
        status: { type: string }
        error: { type: string }
        cbState: { type: string, enum: [CLOSED, OPEN, HALF_OPEN] }
        openedAt: { type: string, format: date-time }
        timeSinceOpenMs: { type: number }
      required: [status, error, cbState]

    HealthDetailResponse:
      type: object
      properties:
        status: { type: string }
        version: { type: string }
        uptimeMs: { type: number }
        dbLatencyMs: { type: number }
        nodeVersion: { type: string }
        cbState: { type: string, enum: [CLOSED, OPEN, HALF_OPEN] }
        auditFailures: { type: integer }
      required:
        [
          status,
          version,
          uptimeMs,
          dbLatencyMs,
          nodeVersion,
          cbState,
          auditFailures,
        ]

    DegradedHealthResponse:
      type: object
      properties:
        status: { type: string }
        uptimeMs: { type: number }
        db: { type: string }
        cbState: { type: string, enum: [CLOSED, OPEN, HALF_OPEN] }
        auditFailures: { type: integer }
        openedAt: { type: string, format: date-time }
        timeSinceOpenMs: { type: number }
      required: [status, uptimeMs, db, cbState, auditFailures]

    # ─── Audit Log ─────────────────────────────────────────────────────────────
    AuditLogEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        tableName: { type: string }
        recordId: { type: string, format: uuid, nullable: true }
        action: { type: string, enum: [INSERT, UPDATE, DELETE] }
        changedAt: { type: string, format: date-time }
        ipAddress: { type: string, nullable: true }
        oldData: { type: object, nullable: true }
        newData: { type: object, nullable: true }
        changedById: { type: string, format: uuid, nullable: true }
        changedByName: { type: string, nullable: true }
      required: [id, tableName, action, changedAt]

    AuditLogListResponse:
      type: object
      properties:
        data:
          { type: array, items: { $ref: "#/components/schemas/AuditLogEntry" } }
        limit: { type: integer }
        offset: { type: integer }
      required: [data, limit, offset]

    # ─── Users ─────────────────────────────────────────────────────────────────
    UserRole:
      type: string
      enum: [administrator, manager, supervisor, team_leader, field_worker]

    UserSafe:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        name: { type: string }
        initials: { type: string }
        role: { $ref: "#/components/schemas/UserRole" }
        teamId: { type: string, format: uuid, nullable: true }
        isActive: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required:
        [id, email, name, initials, role, isActive, createdAt, updatedAt]

    UserCreate:
      type: object
      properties:
        email: { type: string, format: email }
        name: { type: string }
        initials: { type: string }
        password:
          {
            type: string,
            minLength: 8,
            description: A manager-set account password. The plaintext value is never returned by the API.,
          }
        role: { $ref: "#/components/schemas/UserRole" }
        teamId: { type: string, format: uuid }
      required: [email, name, initials, password, role]

    UserUpdate:
      type: object
      properties:
        name: { type: string }
        initials: { type: string }
        role: { $ref: "#/components/schemas/UserRole" }
        teamId: { type: string, format: uuid, nullable: true }
        isActive: { type: boolean }
        password:
          {
            type: string,
            minLength: 8,
            description: Replaces the account password. The plaintext value is hashed and never returned by the API.,
          }

    UserListResponse:
      type: object
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/UserSafe" } }
        total: { type: integer }
      required: [data, total]

    # ─── Job Photos ────────────────────────────────────────────────────────────
    JobPhoto:
      type: object
      properties:
        id: { type: string, format: uuid }
        jobId: { type: string, format: uuid, nullable: true }
        reactiveJobId: { type: string, format: uuid, nullable: true }
        uploadedBy: { type: string, format: uuid }
        blobUrl: { type: string }
        caption: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
      required: [id, uploadedBy, blobUrl, createdAt]

    JobPhotoListResponse:
      type: object
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/JobPhoto" } }
      required: [data]
