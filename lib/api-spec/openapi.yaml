      operationId: retryStormPatrolAlertEmail
      tags: [storm-patrol]
      parameters:
        [
          {
            name: id,
            in: path,
            required: true,
            schema: { type: string, format: uuid },
          },
        ]
      responses:
        {
          "200":
            {
              description: Alert with refreshed email delivery state,
