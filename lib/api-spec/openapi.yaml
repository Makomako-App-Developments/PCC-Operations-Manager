openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Porirua City Council – Garden Asset Management API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: assets
    description: Operational assets
  - name: jobs
    description: Scheduled and reactive jobs
  - name: teams
    description: Teams and members
  - name: audits
    description: Quality audits
  - name: programmes
    description: Infill planting orders and mulching records
  - name: dashboard
    description: Dashboard summary statistics
  - name: schedule
    description: Schedule generation and weekly view
  - name: audit-log
    description: Immutable audit trail
  - name: users
    description: User account management
  - name: storm-patrol
    description: Stormwater emergency patrol events and field checks

# ─── Shared parameters ────────────────────────────────────────────────────────
x-page-param: &pageParam
  name: page
  in: query
  schema: { type: integer, default: 1 }

x-limit-param: &limitParam
  name: limit
  in: query
  schema: { type: integer, default: 50, maximum: 200 }

paths:
  # ─── Health ─────────────────────────────────────────────────────────────────
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── Auth ───────────────────────────────────────────────────────────────────
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/Unauthorised"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out (clears auth cookies)
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Return current authenticated user
      security: [{}]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorised"

  # ─── Assets ─────────────────────────────────────────────────────────────────
  /assets:
    get:
      operationId: listAssets
      tags: [assets]
      summary: List garden assets
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
        - name: search
          in: query
          schema: { type: string }
        - name: gardenType
          in: query
          schema:
            $ref: "#/components/schemas/GardenType"
        - name: department
          in: query
          schema:
            $ref: "#/components/schemas/Department"
        - name: teamId
          in: query
          schema: { type: string, format: uuid }
        - name: ward
          in: query
          schema:
            $ref: "#/components/schemas/Ward"
        - name: isActive
          in: query
          schema: { type: boolean, default: true }
      responses:
        "200":
          description: Paginated list of assets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetListResponse"

    post:
      operationId: createAsset
      tags: [assets]
      summary: Create a new garden asset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"

  /assets/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getAsset
      tags: [assets]
      summary: Get a single asset
      responses:
        "200":
          description: Asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateAsset
      tags: [assets]
      summary: Update an asset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetUpdate"
      responses:
        "200":
          description: Updated asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
    delete:
      operationId: deleteAsset
      tags: [assets]
      summary: Soft-delete an asset
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  # ─── Jobs ───────────────────────────────────────────────────────────────────
  /jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: List scheduled jobs
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
        - name: assetId
          in: query
          schema: { type: string, format: uuid }
        - name: teamId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/JobStatus"
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Paginated list of jobs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobListResponse"

    post:
      operationId: createJob
      tags: [jobs]
      summary: Create a scheduled job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"

  /jobs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getJob
      tags: [jobs]
      summary: Get a single job
      responses:
        "200":
          description: Job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateJob
      tags: [jobs]
      summary: Update job (status, completion, time log)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobUpdate"
      responses:
        "200":
          description: Updated job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"

  /reactive-jobs:
    get:
      operationId: listReactiveJobs
      tags: [jobs]
      summary: List reactive jobs
      responses:
        "200":
          description: Reactive jobs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReactiveJobListResponse"
    post:
      operationId: createReactiveJob
      tags: [jobs]
      summary: Raise a reactive job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReactiveJobCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReactiveJob"

  /reactive-jobs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getReactiveJob
      tags: [jobs]
      summary: Get a reactive job
      responses:
        "200":
          description: Reactive job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReactiveJob"
    patch:
      operationId: updateReactiveJob
      tags: [jobs]
      summary: Update a reactive job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReactiveJobUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReactiveJob"

  # ─── Teams ──────────────────────────────────────────────────────────────────
  /teams:
    get:
      operationId: listTeams
      tags: [teams]
      summary: List all teams
      responses:
        "200":
          description: Teams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Team"
    post:
      operationId: createTeam
      tags: [teams]
      summary: Create a team
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"

  /teams/{id}/members:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getTeamMembers
      tags: [teams]
      summary: Get members of a team
      responses:
        "200":
          description: Team members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserSummary"

  # ─── Dashboard ──────────────────────────────────────────────────────────────
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Return summary statistics for the dashboard
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401":
          $ref: "#/components/responses/Unauthorised"

  # ─── Schedule ────────────────────────────────────────────────────────────────
  /schedule/generate:
    post:
      operationId: generateSchedule
      tags: [schedule]
      summary: Generate scheduled jobs from active assets for a date range
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleGenerateBody"
      responses:
        "200":
          description: Result of schedule generation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleGenerateResult"
        "401":
          $ref: "#/components/responses/Unauthorised"

  /schedule/week:
    get:
      operationId: getScheduleWeek
      tags: [schedule]
      summary: Get all jobs for a given week with asset details
      parameters:
        - name: week
          in: query
          required: true
          schema: { type: string, format: date }
          description: ISO date of any day in the desired week (week starts Monday)
        - name: teamId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Jobs with asset info grouped by day
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleWeekResponse"
        "401":
          $ref: "#/components/responses/Unauthorised"

  /schedule/overdue:
    get:
      operationId: getOverdueScheduleJobs
      tags: [schedule]
      summary: Get unresolved scheduled maintenance jobs from before a given date
      parameters:
        - name: before
          in: query
          required: true
          schema: { type: string, format: date }
          description: Return eligible jobs scheduled before this ISO date
        - name: teamId
          in: query
          schema: { type: string, format: uuid }
          description: Team to retrieve; field users are always restricted to their own team
      responses:
        "200":
          description: Team-scoped unresolved scheduled maintenance jobs in geosequence order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OverdueScheduleJobsResponse"
        "400":
          description: A manager or administrator did not provide a team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorised"

  /schedule/overdue/resolve:
    post:
      operationId: resolveOverdueScheduleJobs
      tags: [schedule]
      summary: Explicitly resolve or replan selected unresolved scheduled work
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveOverdueJobsInput"
      responses:
        "200":
          description: Per-job outcomes for the requested resolution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolveOverdueJobsResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorised"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ─── Programmes ─────────────────────────────────────────────────────────────
  /infill-orders:
    get:
      operationId: listInfillOrders
      tags: [programmes]
      summary: List infill planting orders
      parameters:
        - name: assetId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/InfillStatus"
      responses:
        "200":
          description: Infill orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InfillOrderListResponse"
    post:
      operationId: createInfillOrder
      tags: [programmes]
      summary: Create an infill planting order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InfillOrderCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InfillOrder"

  /infill-orders/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateInfillOrder
      tags: [programmes]
      summary: Update an infill order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InfillOrderUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InfillOrder"

  /mulching-records:
    get:
      operationId: listMulchingRecords
      tags: [programmes]
      summary: List mulching records
      parameters:
        - name: assetId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/MulchingStatus"
      responses:
        "200":
          description: Mulching records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MulchingRecordListResponse"
    post:
      operationId: createMulchingRecord
      tags: [programmes]
      summary: Create a mulching record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MulchingRecordCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MulchingRecord"

  /mulching-records/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateMulchingRecord
      tags: [programmes]
      summary: Update a mulching record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MulchingRecordUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MulchingRecord"

  /mulch-depth-import/preview:
    post:
      operationId: previewMulchDepthImport
      tags: [programmes]
      summary: Validate a mulch-depth workbook before import
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                workbook: { type: string, format: binary }
              required: [workbook]
      responses:
        "200":
          description: Validation preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MulchDepthImportPreview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorised"
        "403":
          $ref: "#/components/responses/Forbidden"

  /mulch-depth-import/commit:
    post:
      operationId: commitMulchDepthImport
      tags: [programmes]
      summary: Atomically import a validated mulch-depth workbook as drafts
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                workbook: { type: string, format: binary }
                batchKey: { type: string, pattern: "^[a-f0-9]{64}$" }
              required: [workbook, batchKey]
      responses:
        "201":
          description: Imported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MulchDepthImportCommit"
        "200":
          description: Already imported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MulchDepthImportCommit"
        "409":
          description: Batch mismatch or incomplete batch marker
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "422":
          description: Workbook validation failed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          $ref: "#/components/responses/Unauthorised"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ─── Audits ─────────────────────────────────────────────────────────────────
  /audits:
    get:
      operationId: listAudits
      tags: [audits]
      summary: List audits
      responses:
        "200":
          description: Audits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditListResponse"
    post:
      operationId: createAudit
      tags: [audits]
      summary: Create an audit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuditCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Audit"

  /audits/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getAudit
      tags: [audits]
      summary: Get an audit with its items and photos
      responses:
        "200":
          description: Audit with items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditDetail"
    patch:
      operationId: updateAudit
      tags: [audits]
      summary: Update an audit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuditUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Audit"
    delete:
      operationId: deleteAudit
      tags: [audits]
      summary: Delete an audit
      responses:
        "204":
          description: Deleted

  /audits/{id}/responses:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: saveAuditResponses
      tags: [audits]
      summary: Bulk-save all KPI responses for an audit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuditResponsesBulk"
      responses:
        "200":
          description: Saved responses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditDetail"

  /audits/{id}/items/{itemId}/photos:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: itemId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listAuditItemPhotos
      tags: [audits]
      summary: List photos for an audit item
      responses:
        "200":
          description: Photos
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditPhoto"
                required: [data]
    post:
      operationId: uploadAuditItemPhoto
      tags: [audits]
      summary: Upload a photo for an audit item (multipart)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                photo:
                  type: string
                  format: binary
                idempotencyKey:
                  type: string
              required: [photo]
      responses:
        "201":
          description: Uploaded photo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPhoto"

  /audits/{id}/items/{itemId}/photos/{photoId}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: itemId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: photoId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: deleteAuditItemPhoto
      tags: [audits]
      summary: Delete a photo from an audit item
      responses:
        "204":
          description: Deleted

  /audits/{id}/pdf:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: downloadAuditPdf
      tags: [audits]
      summary: Download PDF report for an audit
      responses:
        "200":
          description: PDF file
          content:
            application/pdf:
              schema:
                type: string
                format: binary

  # ─── Health (extended) ──────────────────────────────────────────────────────
  /health/live:
    get:
      operationId: getLiveness
      tags: [health]
      summary: Liveness probe
      responses:
        "200":
          description: Alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /health/ready:
    get:
      operationId: getReadiness
      tags: [health]
      summary: Readiness probe — checks DB connectivity
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: Not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessErrorResponse"

  /health:
    get:
      operationId: getFullHealth
      tags: [health]
      summary: Full health status with uptime and version
      responses:
        "200":
          description: Health detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthDetailResponse"
        "503":
          description: Degraded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DegradedHealthResponse"

  # ─── Audit Log ───────────────────────────────────────────────────────────────
  /audit-log:
    get:
      operationId: listAuditLog
      tags: [audit-log]
      summary: List audit log entries (manager/supervisor only)
      parameters:
        - name: table
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Paginated audit log entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogListResponse"
        "401":
          $ref: "#/components/responses/Unauthorised"

  # ─── Users ───────────────────────────────────────────────────────────────────
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users (manager/supervisor only)
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
        "401":
          $ref: "#/components/responses/Unauthorised"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a new staff account (manager only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSafe"
        "401":
          $ref: "#/components/responses/Unauthorised"

  /users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a user account or replace its password (manager only)
      description: Password values are hashed before storage and are never returned. Managers cannot modify administrator accounts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSafe"
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── Skip Review ─────────────────────────────────────────────────────────────
  /jobs/skips:
    get:
      operationId: listSkippedJobs
      tags: [jobs]
      summary: List skipped jobs for manager review
      parameters:
        - name: teamId
          in: query
          schema: { type: string, format: uuid }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: reviewed
          in: query
          schema: { type: string, enum: [yes, no, all], default: all }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 100, maximum: 500 }
      responses:
        "200":
          description: Skipped jobs with task-skip reasons and reviewer info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkippedJobListResponse"

  /jobs/{id}/skip-review:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: reviewSkippedJob
      tags: [jobs]
      summary: Accept or reject a skipped job's reason (manager only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkipReviewRequest"
      responses:
        "200":
          description: Updated job with review fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Job is not in skipped status

  # ─── Job Photos ──────────────────────────────────────────────────────────────
