            required: true,
            schema: { type: string, format: uuid },
          },
        ]
      requestBody:
        required: true
        content:
          {
            application/json:
              { schema: { $ref: "#/components/schemas/StormCompletion" } },
          }
      responses:
        {
          "200":
            {
              description: Completed idempotently,
              content:
