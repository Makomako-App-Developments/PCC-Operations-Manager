openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Porirua City Council – Garden Asset Management API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: assets
    description: Garden assets
  - name: jobs
    description: Scheduled and reactive jobs
  - name: teams
    description: Teams and members
  - name: audits
    description: Quality audits
  - name: programmes
    description: Infill planting orders and mulching records
  - name: dashboard
    description: Dashboard summary statistics
  - name: schedule
    description: Schedule generation and weekly view
  - name: audit-log
    description: Immutable audit trail
  - name: users
    description: User account management

# ─── Shared parameters ────────────────────────────────────────────────────────
x-page-param: &pageParam
  name: page
  in: query
  schema: { type: integer, default: 1 }

x-limit-param: &limitParam
  name: limit
  in: query
  schema: { type: integer, default: 50, maximum: 200 }

paths:
  # ─── Health ─────────────────────────────────────────────────────────────────
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── Auth ───────────────────────────────────────────────────────────────────
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "401":
          $ref: "#/components/responses/Unauthorised"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out (clears auth cookies)
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Return current authenticated user
      security: [{}]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorised"

  # ─── Assets ─────────────────────────────────────────────────────────────────
  /assets:
    get:
      operationId: listAssets
      tags: [assets]
      summary: List garden assets
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
        - name: search
          in: query
          schema: { type: string }
        - name: gardenType
          in: query
          schema:
            $ref: "#/components/schemas/GardenType"
        - name: teamId
          in: query
          schema: { type: string, format: uuid }
        - name: ward
          in: query
          schema:
            $ref: "#/components/schemas/Ward"
        - name: isActive
          in: query
          schema: { type: boolean, default: true }
      responses:
        "200":
          description: Paginated list of assets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetListResponse"

    post:
      operationId: createAsset
      tags: [assets]
      summary: Create a new garden asset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"

  /assets/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getAsset
      tags: [assets]
      summary: Get a single asset
      responses:
        "200":
          description: Asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateAsset
      tags: [assets]
      summary: Update an asset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssetUpdate"
      responses:
        "200":
          description: Updated asset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"
    delete:
      operationId: deleteAsset
      tags: [assets]
      summary: Soft-delete an asset
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OkResponse"

  # ─── Jobs ───────────────────────────────────────────────────────────────────
  /jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: List scheduled jobs
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
        - name: assetId
          in: query
          schema: { type: string, format: uuid }
        - name: teamId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/JobStatus"
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Paginated list of jobs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobListResponse"

    post:
      operationId: createJob
      tags: [jobs]
      summary: Create a scheduled job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"

  /jobs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getJob
      tags: [jobs]
      summary: Get a single job
      responses:
        "200":
          description: Job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateJob
      tags: [jobs]
      summary: Update job (status, completion, time log)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobUpdate"
      responses:
        "200":
          description: Updated job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"

  /reactive-jobs:
    get:
      operationId: listReactiveJobs
      tags: [jobs]
      summary: List reactive jobs
      responses:
        "200":
          description: Reactive jobs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReactiveJobListResponse"
    post:
      operationId: createReactiveJob
      tags: [jobs]
      summary: Raise a reactive job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReactiveJobCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReactiveJob"

  /reactive-jobs/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateReactiveJob
      tags: [jobs]
      summary: Update a reactive job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReactiveJobUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReactiveJob"

  # ─── Teams ──────────────────────────────────────────────────────────────────
  /teams:
    get:
      operationId: listTeams
      tags: [teams]
      summary: List all teams
      responses:
        "200":
          description: Teams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Team"
    post:
      operationId: createTeam
      tags: [teams]
      summary: Create a team
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"

  /teams/{id}/members:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getTeamMembers
      tags: [teams]
      summary: Get members of a team
      responses:
        "200":
          description: Team members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserSummary"

  # ─── Dashboard ──────────────────────────────────────────────────────────────
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Return summary statistics for the dashboard
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        "401":
          $ref: "#/components/responses/Unauthorised"

  # ─── Schedule ────────────────────────────────────────────────────────────────
  /schedule/generate:
    post:
      operationId: generateSchedule
      tags: [schedule]
      summary: Generate scheduled jobs from active assets for a date range
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ScheduleGenerateBody"
      responses:
        "200":
          description: Result of schedule generation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleGenerateResult"
        "401":
          $ref: "#/components/responses/Unauthorised"

  /schedule/week:
    get:
      operationId: getScheduleWeek
      tags: [schedule]
      summary: Get all jobs for a given week with asset details
      parameters:
        - name: week
          in: query
          required: true
          schema: { type: string, format: date }
          description: ISO date of any day in the desired week (week starts Monday)
        - name: teamId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Jobs with asset info grouped by day
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ScheduleWeekResponse"
        "401":
          $ref: "#/components/responses/Unauthorised"

  # ─── Programmes ─────────────────────────────────────────────────────────────
  /infill-orders:
    get:
      operationId: listInfillOrders
      tags: [programmes]
      summary: List infill planting orders
      parameters:
        - name: assetId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/InfillStatus"
      responses:
        "200":
          description: Infill orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InfillOrderListResponse"
    post:
      operationId: createInfillOrder
      tags: [programmes]
      summary: Create an infill planting order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InfillOrderCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InfillOrder"

  /infill-orders/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateInfillOrder
      tags: [programmes]
      summary: Update an infill order
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InfillOrderUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InfillOrder"

  /mulching-records:
    get:
      operationId: listMulchingRecords
      tags: [programmes]
      summary: List mulching records
      parameters:
        - name: assetId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/MulchingStatus"
      responses:
        "200":
          description: Mulching records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MulchingRecordListResponse"
    post:
      operationId: createMulchingRecord
      tags: [programmes]
      summary: Create a mulching record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MulchingRecordCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MulchingRecord"

  /mulching-records/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateMulchingRecord
      tags: [programmes]
      summary: Update a mulching record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MulchingRecordUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MulchingRecord"

  # ─── Audits ─────────────────────────────────────────────────────────────────
  /audits:
    get:
      operationId: listAudits
      tags: [audits]
      summary: List audits
      responses:
        "200":
          description: Audits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditListResponse"
    post:
      operationId: createAudit
      tags: [audits]
      summary: Create an audit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuditCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Audit"

  /audits/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getAudit
      tags: [audits]
      summary: Get an audit with its items and photos
      responses:
        "200":
          description: Audit with items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditDetail"
    patch:
      operationId: updateAudit
      tags: [audits]
      summary: Update an audit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuditUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Audit"
    delete:
      operationId: deleteAudit
      tags: [audits]
      summary: Delete an audit
      responses:
        "204":
          description: Deleted

  /audits/{id}/responses:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: saveAuditResponses
      tags: [audits]
      summary: Bulk-save all KPI responses for an audit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuditResponsesBulk"
      responses:
        "200":
          description: Saved responses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditDetail"

  /audits/{id}/items/{itemId}/photos:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: itemId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listAuditItemPhotos
      tags: [audits]
      summary: List photos for an audit item
      responses:
        "200":
          description: Photos
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuditPhoto"
                required: [data]
    post:
      operationId: uploadAuditItemPhoto
      tags: [audits]
      summary: Upload a photo for an audit item (multipart)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                photo:
                  type: string
                  format: binary
              required: [photo]
      responses:
        "201":
          description: Uploaded photo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditPhoto"

  /audits/{id}/items/{itemId}/photos/{photoId}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: itemId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: photoId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      operationId: deleteAuditItemPhoto
      tags: [audits]
      summary: Delete a photo from an audit item
      responses:
        "204":
          description: Deleted

  /audits/{id}/pdf:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: downloadAuditPdf
      tags: [audits]
      summary: Download PDF report for an audit
      responses:
        "200":
          description: PDF file
          content:
            application/pdf:
              schema:
                type: string
                format: binary

  # ─── Health (extended) ──────────────────────────────────────────────────────
  /health/live:
    get:
      operationId: getLiveness
      tags: [health]
      summary: Liveness probe
      responses:
        "200":
          description: Alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /health/ready:
    get:
      operationId: getReadiness
      tags: [health]
      summary: Readiness probe — checks DB connectivity
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: Not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessErrorResponse"

  /health:
    get:
      operationId: getFullHealth
      tags: [health]
      summary: Full health status with uptime and version
      responses:
        "200":
          description: Health detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthDetailResponse"
        "503":
          description: Degraded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DegradedHealthResponse"

  # ─── Audit Log ───────────────────────────────────────────────────────────────
  /audit-log:
    get:
      operationId: listAuditLog
      tags: [audit-log]
      summary: List audit log entries (manager/supervisor only)
      parameters:
        - name: table
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 200 }
        - name: offset
          in: query
          schema: { type: integer, default: 0 }
      responses:
        "200":
          description: Paginated audit log entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditLogListResponse"
        "401":
          $ref: "#/components/responses/Unauthorised"

  # ─── Users ───────────────────────────────────────────────────────────────────
  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List all users (manager/supervisor only)
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
        "401":
          $ref: "#/components/responses/Unauthorised"
    post:
      operationId: createUser
      tags: [users]
      summary: Create a new staff account (manager only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        "201":
          description: Created user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSafe"
        "401":
          $ref: "#/components/responses/Unauthorised"

  /users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a user account (manager only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSafe"
        "404":
          $ref: "#/components/responses/NotFound"

  # ─── Skip Review ─────────────────────────────────────────────────────────────
  /jobs/skips:
    get:
      operationId: listSkippedJobs
      tags: [jobs]
      summary: List skipped jobs for manager review
      parameters:
        - name: teamId
          in: query
          schema: { type: string, format: uuid }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: reviewed
          in: query
          schema: { type: string, enum: [yes, no, all], default: all }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 100, maximum: 500 }
      responses:
        "200":
          description: Skipped jobs with task-skip reasons and reviewer info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SkippedJobListResponse"

  /jobs/{id}/skip-review:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: reviewSkippedJob
      tags: [jobs]
      summary: Accept or reject a skipped job's reason (manager only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SkipReviewRequest"
      responses:
        "200":
          description: Updated job with review fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: Job is not in skipped status

  # ─── Job Photos ──────────────────────────────────────────────────────────────
  /jobs/{id}/photos:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: listJobPhotos
      tags: [jobs]
      summary: List photo evidence for a job
      responses:
        "200":
          description: Photos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobPhotoListResponse"
    post:
      operationId: uploadJobPhoto
      tags: [jobs]
      summary: Upload a photo for a job (multipart)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                photo:
                  type: string
                  format: binary
                caption:
                  type: string
              required: [photo]
      responses:
        "201":
          description: Uploaded photo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobPhoto"

# ─── Shared responses ──────────────────────────────────────────────────────────
components:
  responses:
    Unauthorised:
      description: Unauthorised
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    # ─── Primitives / enums ─────────────────────────────────────────────────
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    OkResponse:
      type: object
      properties:
        ok:
          type: boolean
      required: [ok]

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required: [error]

    Role:
      type: string
      enum: [administrator, manager, supervisor, team_leader, field_worker]

    GardenType:
      type: string
      enum:
        - annuals
        - roses_perennials
        - ornamental
        - amenity
        - rain_garden
        - reveg
        - bush
        - tree_planter_pits
        - hedge

    Standard:
      type: string
      enum: [high, medium, low]

    Ward:
      type: string
      enum: [eastern, northern, western]

    Frequency:
      type: string
      enum: [weekly, fortnightly, monthly, bimonthly, quarterly]

    JobType:
      type: string
      enum: [scheduled, reactive, mulching, infill_planting]

    JobStatus:
      type: string
      enum: [draft, pending, in_progress, paused, completed, skipped, overdue]

    AuditStatus:
      type: string
      enum: [pending, passed, failed, overdue]

    AuditResult:
      type: string
      enum: [pass, fail, na]

    ReactiveJobStatus:
      type: string
      enum: [raised, assigned, in_progress, completed, cancelled]

    ReactivePriority:
      type: string
      enum: [low, medium, high, urgent]

    # ─── Auth ───────────────────────────────────────────────────────────────
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
      required: [email, password]

    LoginResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/UserSummary"
        accessToken:
          type: string
      required: [user, accessToken]

    # ─── Users ──────────────────────────────────────────────────────────────
    User:
      type: object
      properties:
        id:        { type: string, format: uuid }
        email:     { type: string, format: email }
        name:      { type: string }
        initials:  { type: string }
        role:
          $ref: "#/components/schemas/Role"
        teamId:    { type: string, format: uuid, nullable: true }
        isActive:  { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, email, name, initials, role, isActive, createdAt, updatedAt]

    UserSummary:
      type: object
      properties:
        id:       { type: string, format: uuid }
        name:     { type: string }
        initials: { type: string }
        role:
          $ref: "#/components/schemas/Role"
        teamId:   { type: string, format: uuid, nullable: true }
      required: [id, name, initials, role]

    # ─── Teams ──────────────────────────────────────────────────────────────
    Team:
      type: object
      properties:
        id:        { type: string, format: uuid }
        name:      { type: string }
        createdAt: { type: string, format: date-time }
      required: [id, name, createdAt]

    TeamCreate:
      type: object
      properties:
        name: { type: string }
      required: [name]

    # ─── Assets ─────────────────────────────────────────────────────────────
    Asset:
      type: object
      properties:
        id:              { type: string, format: uuid }
        reference:       { type: string }
        name:            { type: string }
        gardenType:
          $ref: "#/components/schemas/GardenType"
        standard:
          $ref: "#/components/schemas/Standard"
        areaM2:          { type: integer }
        serviceTimeMins: { type: integer }
        frequency:
          $ref: "#/components/schemas/Frequency"
        siteType: { type: string, enum: [park, street], nullable: true }
        teamId:          { type: string, format: uuid, nullable: true }
        ward:
          allOf:
            - $ref: "#/components/schemas/Ward"
          nullable: true
        suburb:        { type: string, nullable: true }
        streetAddress: { type: string, nullable: true }
        lat:           { type: number, nullable: true }
        lng:           { type: number, nullable: true }
        routeOrder:    { type: integer, nullable: true }
        description:   { type: string, nullable: true }
        notes:         { type: string, nullable: true }
        isActive:      { type: boolean }
        createdAt:     { type: string, format: date-time }
        updatedAt:     { type: string, format: date-time }
      required:
        - id
        - reference
        - name
        - gardenType
        - standard
        - areaM2
        - serviceTimeMins
        - frequency
        - isActive
        - createdAt
        - updatedAt

    AssetCreate:
      type: object
      properties:
        reference:       { type: string }
        name:            { type: string }
        gardenType:
          $ref: "#/components/schemas/GardenType"
        standard:
          $ref: "#/components/schemas/Standard"
        areaM2:          { type: integer }
        serviceTimeMins: { type: integer }
        frequency:
          $ref: "#/components/schemas/Frequency"
        siteType: { type: string, enum: [park, street] }
        teamId:        { type: string, format: uuid }
        ward:
          $ref: "#/components/schemas/Ward"
        suburb:        { type: string }
        streetAddress: { type: string }
        lat:           { type: number }
        lng:           { type: number }
        routeOrder:    { type: integer }
        description:   { type: string }
        notes:         { type: string }
      required:
        - reference
        - name
        - gardenType
        - standard
        - areaM2
        - serviceTimeMins
        - frequency

    AssetUpdate:
      type: object
      properties:
        name:            { type: string }
        gardenType:
          $ref: "#/components/schemas/GardenType"
        standard:
          $ref: "#/components/schemas/Standard"
        areaM2:          { type: integer }
        serviceTimeMins: { type: integer }
        frequency:
          $ref: "#/components/schemas/Frequency"
        teamId:        { type: string, format: uuid }
        ward:
          $ref: "#/components/schemas/Ward"
        suburb:        { type: string }
        streetAddress: { type: string }
        lat:           { type: number }
        lng:           { type: number }
        notes:         { type: string }
        isActive:      { type: boolean }

    AssetListResponse:
      type: object
      properties:
        data:  { type: array, items: { $ref: "#/components/schemas/Asset" } }
        total: { type: integer }
        page:  { type: integer }
        limit: { type: integer }
      required: [data, total, page, limit]

    # ─── Jobs ───────────────────────────────────────────────────────────────
    Job:
      type: object
      properties:
        id:             { type: string, format: uuid }
        assetId:        { type: string, format: uuid }
        jobType:
          $ref: "#/components/schemas/JobType"
        status:
          $ref: "#/components/schemas/JobStatus"
        teamId:         { type: string, format: uuid, nullable: true }
        assignedUserId: { type: string, format: uuid, nullable: true }
        scheduledDate:  { type: string, format: date }
        startedAt:      { type: string, format: date-time, nullable: true }
        completedAt:    { type: string, format: date-time, nullable: true }
        actualTimeMins: { type: integer, nullable: true }
        notes:          { type: string, nullable: true }
        createdAt:      { type: string, format: date-time }
        updatedAt:      { type: string, format: date-time }
      required:
        - id
        - assetId
        - jobType
        - status
        - scheduledDate
        - createdAt
        - updatedAt

    JobCreate:
      type: object
      properties:
        assetId:        { type: string, format: uuid }
        jobType:
          $ref: "#/components/schemas/JobType"
        teamId:         { type: string, format: uuid }
        assignedUserId: { type: string, format: uuid }
        scheduledDate:  { type: string, format: date }
        notes:          { type: string }
      required: [assetId, jobType, scheduledDate]

    JobUpdate:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/JobStatus"
        assignedUserId: { type: string, format: uuid }
        startedAt:      { type: string, format: date-time }
        completedAt:    { type: string, format: date-time }
        actualTimeMins: { type: integer }
        notes:          { type: string }

    SkipReviewOutcome:
      type: string
      enum: [accepted, rejected]

    SkipReviewRequest:
      type: object
      properties:
        outcome:
          $ref: "#/components/schemas/SkipReviewOutcome"
        notes: { type: string }
      required: [outcome]

    TaskSkipReason:
      type: object
      properties:
        id:          { type: string, format: uuid }
        jobId:       { type: string, format: uuid }
        taskIndex:   { type: integer }
        taskLabel:   { type: string }
        reason:      { type: string }
        createdById: { type: string, format: uuid, nullable: true }
        createdAt:   { type: string, format: date-time }
      required: [id, jobId, taskIndex, taskLabel, reason, createdAt]

    SkippedJob:
      type: object
      properties:
        id:                { type: string, format: uuid }
        assetId:           { type: string, format: uuid }
        jobType:
          $ref: "#/components/schemas/JobType"
        status:
          $ref: "#/components/schemas/JobStatus"
        teamId:            { type: string, format: uuid, nullable: true }
        scheduledDate:     { type: string, format: date }
        skipReason:        { type: string, nullable: true }
        notes:             { type: string, nullable: true }
        skipReviewedAt:    { type: string, format: date-time, nullable: true }
        skipReviewedById:  { type: string, format: uuid, nullable: true }
        skipReviewOutcome:
          allOf:
            - $ref: "#/components/schemas/SkipReviewOutcome"
          nullable: true
        skipReviewNotes:   { type: string, nullable: true }
        reviewerName:      { type: string, nullable: true }
        reviewerInitials:  { type: string, nullable: true }
        createdAt:         { type: string, format: date-time }
        updatedAt:         { type: string, format: date-time }
        taskSkipReasons:   { type: array, items: { $ref: "#/components/schemas/TaskSkipReason" } }
      required: [id, assetId, jobType, status, scheduledDate, createdAt, updatedAt, taskSkipReasons]

    SkippedJobListResponse:
      type: object
      properties:
        data:  { type: array, items: { $ref: "#/components/schemas/SkippedJob" } }
        page:  { type: integer }
        limit: { type: integer }
      required: [data, page, limit]

    JobListResponse:
      type: object
      properties:
        data:  { type: array, items: { $ref: "#/components/schemas/Job" } }
        page:  { type: integer }
        limit: { type: integer }
      required: [data, page, limit]

    ReactiveJob:
      type: object
      properties:
        id:             { type: string, format: uuid }
        assetId:        { type: string, format: uuid }
        raisedById:     { type: string, format: uuid }
        assignedTeamId: { type: string, format: uuid, nullable: true }
        assignedUserId: { type: string, format: uuid, nullable: true }
        issueType:      { type: string }
        description:    { type: string }
        status:
          $ref: "#/components/schemas/ReactiveJobStatus"
        priority:
          $ref: "#/components/schemas/ReactivePriority"
        raisedAt:       { type: string, format: date-time }
        startedAt:      { type: string, format: date-time, nullable: true }
        completedAt:    { type: string, format: date-time, nullable: true }
        actualTimeMins: { type: integer, nullable: true }
        notes:          { type: string, nullable: true }
        createdAt:      { type: string, format: date-time }
        updatedAt:      { type: string, format: date-time }
      required:
        - id
        - assetId
        - raisedById
        - issueType
        - description
        - status
        - priority
        - raisedAt
        - createdAt
        - updatedAt

    ReactiveJobCreate:
      type: object
      properties:
        assetId:        { type: string, format: uuid }
        issueType:      { type: string }
        description:    { type: string }
        priority:
          $ref: "#/components/schemas/ReactivePriority"
        assignedTeamId: { type: string, format: uuid }
      required: [assetId, issueType, description]

    ReactiveJobUpdate:
      type: object
      properties:
        status:
          $ref: "#/components/schemas/ReactiveJobStatus"
        priority:
          $ref: "#/components/schemas/ReactivePriority"
        assignedTeamId: { type: string, format: uuid }
        assignedUserId: { type: string, format: uuid }
        startedAt:      { type: string, format: date-time }
        completedAt:    { type: string, format: date-time }
        actualTimeMins: { type: integer }
        notes:          { type: string }

    ReactiveJobListResponse:
      type: object
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/ReactiveJob" } }
      required: [data]

    # ─── Audits ─────────────────────────────────────────────────────────────
    Audit:
      type: object
      properties:
        id:            { type: string, format: uuid }
        assetId:       { type: string, format: uuid }
        auditorId:     { type: string, format: uuid }
        teamId:        { type: string, format: uuid, nullable: true }
        scheduledDate: { type: string, format: date, nullable: true }
        conductedAt:   { type: string, format: date-time }
        completedDate: { type: string, format: date, nullable: true }
        overallScore:  { type: number, minimum: 0, maximum: 100, nullable: true }
        status:
          $ref: "#/components/schemas/AuditStatus"
        notes:         { type: string, nullable: true }
        createdAt:     { type: string, format: date-time }
        updatedAt:     { type: string, format: date-time }
      required:
        - id
        - assetId
        - auditorId
        - conductedAt
        - status
        - createdAt
        - updatedAt

    AuditCreate:
      type: object
      properties:
        assetId:    { type: string, format: uuid }
        teamId:     { type: string, format: uuid }
        conductedAt: { type: string, format: date-time }
        notes:      { type: string }
      required: [assetId]

    AuditUpdate:
      type: object
      properties:
        teamId:       { type: string, format: uuid }
        conductedAt:  { type: string, format: date-time }
        completedDate: { type: string, format: date }
        overallScore: { type: number, minimum: 0, maximum: 100 }
        status:
          $ref: "#/components/schemas/AuditStatus"
        notes:        { type: string }

    AuditItem:
      type: object
      properties:
        id:        { type: string, format: uuid }
        auditId:   { type: string, format: uuid }
        criterion: { type: string }
        result:
          $ref: "#/components/schemas/AuditResult"
        notes:     { type: string, nullable: true }
        failLat:   { type: number, nullable: true }
        failLng:   { type: number, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        photos:
          type: array
          items:
            $ref: "#/components/schemas/AuditPhoto"
      required: [id, auditId, criterion, result, createdAt, updatedAt]

    AuditItemResponse:
      type: object
      properties:
        criterion: { type: string }
        result:
          $ref: "#/components/schemas/AuditResult"
        notes:     { type: string }
        failLat:   { type: number }
        failLng:   { type: number }
      required: [criterion, result]

    AuditResponsesBulk:
      type: object
      properties:
        responses:
          type: array
          items:
            $ref: "#/components/schemas/AuditItemResponse"
      required: [responses]

    AuditPhoto:
      type: object
      properties:
        id:          { type: string, format: uuid }
        auditItemId: { type: string, format: uuid }
        uploadedBy:  { type: string, format: uuid }
        blobUrl:     { type: string }
        createdAt:   { type: string, format: date-time }
      required: [id, auditItemId, uploadedBy, blobUrl, createdAt]

    AuditDetail:
      allOf:
        - $ref: "#/components/schemas/Audit"
        - type: object
          properties:
            items:
              type: array
              items:
                $ref: "#/components/schemas/AuditItem"
          required: [items]

    AuditListResponse:
      type: object
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Audit" } }
      required: [data]

    # ─── Dashboard ──────────────────────────────────────────────────────────
    AssetTypeCount:
      type: object
      properties:
        gardenType: { type: string }
        count:      { type: integer }
      required: [gardenType, count]

    TeamJobCount:
      type: object
      properties:
        teamId:         { type: string, format: uuid }
        teamName:       { type: string }
        jobCount:       { type: integer }
        completedCount: { type: integer }
      required: [teamId, teamName, jobCount, completedCount]

    DashboardSummary:
      type: object
      properties:
        totalAssets:        { type: integer }
        activeAssets:       { type: integer }
        jobsThisWeek:       { type: integer }
        completedThisWeek:  { type: integer }
        overdueJobs:        { type: integer }
        openReactiveJobs:   { type: integer }
        assetsByType:
          type: array
          items: { $ref: "#/components/schemas/AssetTypeCount" }
        teamSummary:
          type: array
          items: { $ref: "#/components/schemas/TeamJobCount" }
      required:
        - totalAssets
        - activeAssets
        - jobsThisWeek
        - completedThisWeek
        - overdueJobs
        - openReactiveJobs
        - assetsByType
        - teamSummary

    # ─── Schedule ────────────────────────────────────────────────────────────
    ScheduleGenerateBody:
      type: object
      properties:
        fromDate: { type: string, format: date }
        toDate:   { type: string, format: date }
        teamId:   { type: string, format: uuid }
      required: [fromDate, toDate]

    ScheduleGenerateResult:
      type: object
      properties:
        jobsCreated: { type: integer }
        fromDate:    { type: string, format: date }
        toDate:      { type: string, format: date }
      required: [jobsCreated, fromDate, toDate]

    JobWithAsset:
      allOf:
        - $ref: "#/components/schemas/Job"
        - type: object
          properties:
            assetName:    { type: string }
            assetRef:     { type: string }
            gardenType:   { type: string }
            suburb:       { type: string, nullable: true }
            serviceTimeMins: { type: integer }
          required: [assetName, assetRef, gardenType, serviceTimeMins]

    ScheduleWeekDay:
      type: object
      properties:
        date: { type: string, format: date }
        jobs:
          type: array
          items: { $ref: "#/components/schemas/JobWithAsset" }
      required: [date, jobs]

    ScheduleWeekResponse:
      type: object
      properties:
        weekStart: { type: string, format: date }
        weekEnd:   { type: string, format: date }
        days:
          type: array
          items: { $ref: "#/components/schemas/ScheduleWeekDay" }
        totalJobs:      { type: integer }
        completedJobs:  { type: integer }
      required: [weekStart, weekEnd, days, totalJobs, completedJobs]

    # ─── Programmes ──────────────────────────────────────────────────────────
    InfillStatus:
      type: string
      enum: [draft, ordered, delivered, planted]

    MulchingStatus:
      type: string
      enum: [due, scheduled, completed, not_required]

    InfillOrder:
      type: object
      properties:
        id:              { type: string, format: uuid }
        assetId:         { type: string, format: uuid }
        assetName:       { type: string, nullable: true }
        assetRef:        { type: string, nullable: true }
        speciesName:     { type: string }
        speciesCategory: { type: string }
        quantity:        { type: integer }
        status:
          $ref: "#/components/schemas/InfillStatus"
        orderedById:  { type: string, format: uuid, nullable: true }
        orderDate:    { type: string, format: date, nullable: true }
        deliveryDate: { type: string, format: date, nullable: true }
        plantedDate:  { type: string, format: date, nullable: true }
        supplierRef:  { type: string, nullable: true }
        unitCostNzd:  { type: string, nullable: true }
        notes:        { type: string, nullable: true }
        createdAt:    { type: string, format: date-time }
        updatedAt:    { type: string, format: date-time }
      required: [id, assetId, speciesName, speciesCategory, quantity, status, createdAt, updatedAt]

    InfillOrderCreate:
      type: object
      properties:
        assetId:         { type: string, format: uuid }
        speciesName:     { type: string }
        speciesCategory: { type: string }
        quantity:        { type: integer }
        status:
          $ref: "#/components/schemas/InfillStatus"
        orderDate:    { type: string, format: date }
        deliveryDate: { type: string, format: date }
        plantedDate:  { type: string, format: date }
        supplierRef:  { type: string }
        unitCostNzd:  { type: string }
        notes:        { type: string }
      required: [assetId, speciesName, speciesCategory, quantity]

    InfillOrderUpdate:
      type: object
      properties:
        speciesName:     { type: string }
        speciesCategory: { type: string }
        quantity:        { type: integer }
        status:
          $ref: "#/components/schemas/InfillStatus"
        orderDate:    { type: string, format: date }
        deliveryDate: { type: string, format: date }
        plantedDate:  { type: string, format: date }
        supplierRef:  { type: string }
        unitCostNzd:  { type: string }
        notes:        { type: string }

    InfillOrderListResponse:
      type: object
      properties:
        data:  { type: array, items: { $ref: "#/components/schemas/InfillOrder" } }
        total: { type: integer }
      required: [data, total]

    MulchingRecord:
      type: object
      properties:
        id:            { type: string, format: uuid }
        assetId:       { type: string, format: uuid }
        assetName:     { type: string, nullable: true }
        assetRef:      { type: string, nullable: true }
        scheduledDate: { type: string, format: date, nullable: true }
        completedDate: { type: string, format: date, nullable: true }
        volumeM3:      { type: string, nullable: true }
        status:
          $ref: "#/components/schemas/MulchingStatus"
        mulchType:  { type: string, nullable: true }
        contractor: { type: string, nullable: true }
        costNzd:    { type: string, nullable: true }
        notes:      { type: string, nullable: true }
        createdAt:  { type: string, format: date-time }
        updatedAt:  { type: string, format: date-time }
      required: [id, assetId, status, createdAt, updatedAt]

    MulchingRecordCreate:
      type: object
      properties:
        assetId:       { type: string, format: uuid }
        scheduledDate: { type: string, format: date }
        completedDate: { type: string, format: date }
        volumeM3:      { type: string }
        status:
          $ref: "#/components/schemas/MulchingStatus"
        mulchType:  { type: string }
        contractor: { type: string }
        costNzd:    { type: string }
        notes:      { type: string }
      required: [assetId]

    MulchingRecordUpdate:
      type: object
      properties:
        scheduledDate: { type: string, format: date }
        completedDate: { type: string, format: date }
        volumeM3:      { type: string }
        status:
          $ref: "#/components/schemas/MulchingStatus"
        mulchType:  { type: string }
        contractor: { type: string }
        costNzd:    { type: string }
        notes:      { type: string }

    MulchingRecordListResponse:
      type: object
      properties:
        data:  { type: array, items: { $ref: "#/components/schemas/MulchingRecord" } }
        total: { type: integer }
      required: [data, total]

    # ─── Health (extended) ─────────────────────────────────────────────────────
    ReadinessResponse:
      type: object
      properties:
        status:      { type: string }
        dbLatencyMs: { type: number }
        cbState:     { type: string, enum: [CLOSED, OPEN, HALF_OPEN] }
      required: [status, dbLatencyMs, cbState]

    ReadinessErrorResponse:
      type: object
      properties:
        status:         { type: string }
        error:          { type: string }
        cbState:        { type: string, enum: [CLOSED, OPEN, HALF_OPEN] }
        openedAt:       { type: string, format: date-time }
        timeSinceOpenMs: { type: number }
      required: [status, error, cbState]

    HealthDetailResponse:
      type: object
      properties:
        status:       { type: string }
        version:      { type: string }
        uptimeMs:     { type: number }
        dbLatencyMs:  { type: number }
        nodeVersion:  { type: string }
        cbState:      { type: string, enum: [CLOSED, OPEN, HALF_OPEN] }
        auditFailures: { type: integer }
      required: [status, version, uptimeMs, dbLatencyMs, nodeVersion, cbState, auditFailures]

    DegradedHealthResponse:
      type: object
      properties:
        status:          { type: string }
        uptimeMs:        { type: number }
        db:              { type: string }
        cbState:         { type: string, enum: [CLOSED, OPEN, HALF_OPEN] }
        auditFailures:   { type: integer }
        openedAt:        { type: string, format: date-time }
        timeSinceOpenMs: { type: number }
      required: [status, uptimeMs, db, cbState, auditFailures]

    # ─── Audit Log ─────────────────────────────────────────────────────────────
    AuditLogEntry:
      type: object
      properties:
        id:            { type: string, format: uuid }
        tableName:     { type: string }
        recordId:      { type: string, format: uuid, nullable: true }
        action:        { type: string, enum: [INSERT, UPDATE, DELETE] }
        changedAt:     { type: string, format: date-time }
        ipAddress:     { type: string, nullable: true }
        oldData:       { type: object, nullable: true }
        newData:       { type: object, nullable: true }
        changedById:   { type: string, format: uuid, nullable: true }
        changedByName: { type: string, nullable: true }
      required: [id, tableName, action, changedAt]

    AuditLogListResponse:
      type: object
      properties:
        data:   { type: array, items: { $ref: "#/components/schemas/AuditLogEntry" } }
        limit:  { type: integer }
        offset: { type: integer }
      required: [data, limit, offset]

    # ─── Users ─────────────────────────────────────────────────────────────────
    UserRole:
      type: string
      enum: [administrator, manager, supervisor, team_leader, field_worker]

    UserSafe:
      type: object
      properties:
        id:        { type: string, format: uuid }
        email:     { type: string }
        name:      { type: string }
        initials:  { type: string }
        role:      { $ref: "#/components/schemas/UserRole" }
        teamId:    { type: string, format: uuid, nullable: true }
        isActive:  { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [id, email, name, initials, role, isActive, createdAt, updatedAt]

    UserCreate:
      type: object
      properties:
        email:    { type: string, format: email }
        name:     { type: string }
        initials: { type: string }
        password: { type: string, minLength: 8 }
        role:     { $ref: "#/components/schemas/UserRole" }
        teamId:   { type: string, format: uuid }
      required: [email, name, initials, password, role]

    UserUpdate:
      type: object
      properties:
        name:     { type: string }
        initials: { type: string }
        role:     { $ref: "#/components/schemas/UserRole" }
        teamId:   { type: string, format: uuid, nullable: true }
        isActive: { type: boolean }
        password: { type: string, minLength: 8 }

    UserListResponse:
      type: object
      properties:
        data:  { type: array, items: { $ref: "#/components/schemas/UserSafe" } }
        total: { type: integer }
      required: [data, total]

    # ─── Job Photos ────────────────────────────────────────────────────────────
    JobPhoto:
      type: object
      properties:
        id:            { type: string, format: uuid }
        jobId:         { type: string, format: uuid, nullable: true }
        reactiveJobId: { type: string, format: uuid, nullable: true }
        uploadedBy:    { type: string, format: uuid }
        blobUrl:       { type: string }
        caption:       { type: string, nullable: true }
        createdAt:     { type: string, format: date-time }
      required: [id, uploadedBy, blobUrl, createdAt]

    JobPhotoListResponse:
      type: object
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/JobPhoto" } }
      required: [data]
